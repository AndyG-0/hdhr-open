name: Publish Docker images

# Builds and pushes the backend/frontend images to GHCR on every version
# tag (see README's "Run with pre-built Docker images" section and
# docker-compose.prod.yml). Tagging a release `vX.Y.Z` (matching VERSION)
# is what triggers this — pushes to main do not publish images.
#
# Each image is built natively for linux/amd64 and linux/arm64 (Raspberry
# Pi) on their respective architecture's own hosted runner — no QEMU
# emulation, since the backend image compiles ccextractor from source and
# that's slow under emulation. The `build` job pushes each per-platform
# image by digest only; the `merge` job then assembles the digests for a
# given image into one multi-platform manifest under the real tags. See
# https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hdhropen-backend
            context: .
            dockerfile: backend/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - image: hdhropen-backend
            context: .
            dockerfile: backend/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: hdhropen-frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - image: hdhropen-frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [[ "$tag_version" != "$file_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($file_version)."
            exit 1
          fi

      - name: Lowercase image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Sanitize platform name for artifact key
        id: platform
        run: echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
        env:
          platform: ${{ matrix.platform }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - hdhropen-backend
          - hdhropen-frontend
    steps:
      - name: Lowercase image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect pushed manifest
        run: |
          docker buildx imagetools inspect ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
