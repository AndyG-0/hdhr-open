name: Release

# Creates the GitHub Release for a tagged version. Cut a release with
# `scripts/release.sh <major|minor|patch>`. Runs independently of
# publish-images.yml, which builds/pushes the Docker images for the same tag.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [[ "$tag_version" != "$file_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($file_version)."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
