included:
  - HDHROpenKit/Sources
  - HDHROpenKit/Tests
  - HDHROpeniOS
  - HDHROpeniOSTests
  - HDHROpenTV
  - HDHROpenTVTests

excluded:
  - HDHROpenKit/.build
  - "**/*.xcodeproj"

disabled_rules:
  - todo
  - trailing_comma
  - multiple_closures_with_trailing_closure

line_length:
  warning: 160
  error: 300
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 80
  error: 200

type_body_length:
  warning: 400
  error: 800

file_length:
  warning: 500
  error: 1000

cyclomatic_complexity:
  warning: 20
  error: 30

large_tuple:
  # Test files establish a `makeEnvironmentObjects() -> (A, B, C, D, E)` helper
  # convention for constructing SwiftUI @EnvironmentObject fixtures - up to 5
  # members in test code only, not a production code smell.
  warning: 6
  error: 6

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - to
    - vm
    - ai

type_name:
  # This codebase deliberately prefixes platform-specific types with a
  # lowercase platform tag (iOSGuideView, TVGuideView, etc.) to mirror
  # Apple's own "iOS"/"tvOS" capitalization - not a naming mistake.
  validates_start_with_lowercase: warning
