build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 6
  CyclomaticComplexMethod:
    active: true
    threshold: 35
    ignoreAnnotated: ['Composable']
  LargeClass:
    active: true
    threshold: 800
  LongMethod:
    active: true
    threshold: 150
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 25
    constructorThreshold: 25
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotated: ['Composable']
  MethodOverloading:
    active: false
  NestedBlockDepth:
    active: true
    threshold: 8
  StringLiteralDuplication:
    active: false
  TooManyFunctions:
    active: false

naming:
  active: true
  ConstructorParameterNaming:
    active: false
  FunctionNaming:
    active: true
    functionPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
    excludeClassPattern: '$^'
    ignoreAnnotated: ['Composable']
  FunctionParameterNaming:
    active: false
  TopLevelPropertyNaming:
    active: false
  VariableNaming:
    active: false
  MatchingDeclarationName:
    active: false

style:
  active: true
  WildcardImport:
    active: false
  MagicNumber:
    active: false
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']
  UnusedParameter:
    active: true
    ignoreAnnotated: ['Composable']
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  FunctionOnlyReturningConstant:
    active: false
  ThrowsCount:
    active: false

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: false

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: false
  NullableToStringCall:
    active: false
  ImplicitDefaultLocale:
    active: false

performance:
  active: true
  SpreadOperator:
    active: false
