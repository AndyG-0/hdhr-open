# Project-level Gradle settings.

# JVM memory arguments for the Gradle Daemon
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Android Gradle Plugin properties
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9's built-in Kotlin support is a large architectural change (replaces
# the org.jetbrains.kotlin.android plugin entirely). Opt out for now and keep
# the classic Kotlin Gradle plugin setup; Google's own documented escape
# hatch, removed in AGP 10 (mid-2026) so this will need real migration later.
android.builtInKotlin=false
android.newDsl=false
