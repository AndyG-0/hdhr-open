# podman-compose defaults to putting all services in a shared pod
# (`in_pod: true`), but podman rejects `--userns` together with `--pod`
# (see the commented `userns_mode: keep-id` block below) — disable the pod
# project-wide. Nothing here relies on it: services reach each other over
# published ports/LAN addresses, not pod-shared localhost. This key is
# ignored (not an error) by plain `docker compose`.
x-podman:
  in_pod: false

services:
  backend:
    image: ghcr.io/andyg-0/hdhropen-backend:${HDHROPEN_VERSION:-latest}
    # Compose's default pull_policy ("missing") only pulls when no local
    # image with this tag exists yet — with a floating tag like the
    # `:latest` default above, that means a host that already pulled once
    # keeps running the old image on every future `up -d` until someone
    # remembers to run `docker compose pull` first. Always pull instead.
    pull_policy: always
    ports:
      # BACKEND_PORT (host side) is independent of UVICORN_PORT (container
      # side, see environment: below) — the container's own network
      # namespace means the internal port can never collide with another
      # container's, so BACKEND_PORT alone is enough to dodge a host-port
      # collision with another service. Keep PUBLIC_API_BASE_URL below in
      # sync if you change BACKEND_PORT.
      - "${BACKEND_PORT:-8000}:${UVICORN_PORT:-8000}"
    environment:
      # What port uvicorn actually binds to inside the container (see
      # backend/Dockerfile) — only needs to change if something inside the
      # container's own namespace also wants port 8000 (rare); a host-level
      # port collision with another container is handled by BACKEND_PORT
      # above instead.
      - UVICORN_PORT=${UVICORN_PORT:-8000}
      - DB_PATH=/app/data/storage.db
      # Without this, the secret-encryption key (backend/app/crypto.py)
      # defaults to /app/secret.key, which isn't backed by the volume below
      # — every container recreation would generate a fresh key and strand
      # every encrypted secret written under the old one.
      - SECRET_KEY_PATH=/app/data/secret.key
      # Same reasoning again: without this, generated caption/thumbnail
      # cache files (backend/app/dvr/media_cache.py) default to
      # /app/hdhomerun_media_cache, outside the volume below — every
      # container recreation would re-pay the ffmpeg/ffprobe cost for every
      # previously-cached recording.
      - HDHOMERUN_MEDIA_CACHE_DIR=/app/data/hdhomerun_media_cache
      # Where the self-hosted ("builtin") DVR engine writes recorded files.
      # Named-volume storage isn't sized for hours of recordings — set
      # RECORDINGS_PATH (see the volumes: block below) to a bind-mounted
      # NAS/large-disk host path in production.
      - RECORDINGS_DIR=/app/data/recordings
      # Same reasoning again: without this, rotated backend log files
      # (backend/app/logging_config.py) default to /app/logs, outside the
      # volume below — every container recreation would lose the history of
      # what the DVR retention/disk-space safeguard did, which is exactly
      # what's needed after the fact to diagnose why recordings disappeared.
      - LOG_DIR=/app/data/logs
      # Must match wherever the *browser* actually loads the frontend from —
      # this compose file serves it on port 3000, not the backend's own
      # 5173 default (that's the local Vite dev server's port). Overriding
      # here (rather than relying on backend/.env) means it's always correct
      # for this deployment out of the box; override again if
      # PUBLIC_API_BASE_URL below is also pointed at a non-default host.
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend/.env:/app/.env
      # CONFIG_PATH/RECORDINGS_PATH let you redirect either piece to a host
      # path (e.g. CONFIG_PATH=/srv/hdhropen/config, RECORDINGS_PATH=/mnt/nas/tv
      # in the .env file next to this compose file) instead of the default
      # Docker-managed named volumes. The container runs as a fixed non-root
      # uid/gid 1000 ("hdhropen", see Dockerfile) with no supplementary
      # groups, so any host directory used here must be writable by uid 1000.
      - ${CONFIG_PATH:-backend-storage}:/app/data
      - ${RECORDINGS_PATH:-recordings-storage}:/app/data/recordings
    # Uncomment to enable the "qsv"/"vaapi" hwaccel presets
    # (app/transcoding.py) — the image bundles the VA-API/QSV driver
    # packages (see backend/Dockerfile), but a container has no access to
    # host devices unless one is explicitly passed through, and not every
    # host even has a GPU render node (e.g. this repo's own
    # macOS/podman-machine testing has none) — mapping a device that
    # doesn't exist fails container creation outright, so this can't be
    # on by default.
    # devices:
    #   - /dev/dri:/dev/dri
    # The backend runs as a fixed non-root user (uid/gid 1000 "hdhropen",
    # see Dockerfile) with no supplementary groups, but /dev/dri/renderD128
    # is normally owned by the host's "render" group at mode 660 — without
    # group_add, opening it fails with a permission error even with the
    # device mapped above. Find the real GID with `getent group render` on
    # the host (it's host-specific, not something this file can hardcode)
    # and set it as RENDER_GID, e.g. `RENDER_GID=108 docker compose up -d`.
    # Note that `privileged: true` is NOT a substitute: a non-root process
    # gets no effective capabilities from it, so CAP_DAC_OVERRIDE never
    # applies and the open still fails.
    # group_add:
    #   - "${RENDER_GID:-108}"
    #
    # Rootless Podman instead of Docker: the container's fixed uid/gid 1000
    # ("hdhropen") is NOT the invoking host user by default under rootless
    # Podman — it's remapped into the subuid range — which breaks both the
    # host-owned CONFIG_PATH/RECORDINGS_PATH bind mounts above and
    # /dev/dri access. userns_mode: keep-id maps the invoking host user
    # (uid/gid 1000) to itself inside the container instead. Once keep-id
    # is set, the numeric group_add above stops working (that GID isn't
    # part of the user-namespace mapping) — use Podman's keep-groups
    # escape hatch instead, which passes the invoking user's real
    # supplementary groups straight through. keep-groups requires the crun
    # runtime and is exclusive: no other group_add entries may be combined
    # with it. See docs/hardware-acceleration.md.
    # userns_mode: keep-id
    # group_add:
    #   - keep-groups
    # Two more things that commonly go wrong once the device is mapped, both
    # reported by the hardware-acceleration diagnostics (Settings -> Edit
    # playback settings -> Run diagnostics):
    #   * The render node isn't always renderD128. A second DRM device (a
    #     discrete GPU, or a simpledrm/vkms node) shifts the iGPU to
    #     renderD129; set the "Render device" setting to match.
    #   * Some Intel setups need the driver named explicitly. If vainfo
    #     reports no driver, add LIBVA_DRIVER_NAME=iHD (Intel Gen8+),
    #     i965 (older Intel) or radeonsi (AMD) to the environment above.
    #
    # Uncomment instead (not in addition — pick the block matching your GPU)
    # to enable the "nvenc" hwaccel preset on a host with an NVIDIA GPU.
    # Requires the NVIDIA Container Toolkit installed on the host
    # (`nvidia-ctk runtime configure --runtime=docker` then restart Docker)
    # — see docs/hardware-acceleration.md. This does NOT need Swarm mode:
    # `docker compose up` (Compose V2) honors `deploy.resources.reservations`
    # directly. Also add `- NVIDIA_DRIVER_CAPABILITIES=compute,video,utility`
    # to the `environment:` list above — without it, the toolkit's default
    # capability set (compute,utility) doesn't inject libnvidia-encode.so
    # into the container, and h264_nvenc fails to load even with the GPU
    # visible.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      # CMD-SHELL (not CMD) so ${UVICORN_PORT} is expanded against the
      # container's own environment at check time, matching whatever port
      # the CMD above actually bound to.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${UVICORN_PORT:-8000}/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/andyg-0/hdhropen-frontend:${HDHROPEN_VERSION:-latest}
    pull_policy: always
    environment:
      # Read at request time, not baked into the image — must be an address
      # the *browser* can reach the backend at. Defaults to localhost, which
      # is correct only when the browser and both containers share a host
      # (e.g. the kiosk Pi itself). For any other topology (frontend and
      # backend on different hosts, a custom port, ...) override this —
      # no rebuild needed, just restart the container.
      # If you override BACKEND_PORT above, override this to match — it
      # isn't derived automatically (nested ${...} defaults aren't reliably
      # supported across Compose implementations).
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend-storage:
  recordings-storage:
