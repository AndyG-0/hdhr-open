; Minimal comskip settings for the automated sweep (app/dvr/builtin/comskip.py).
; comskip has no CLI flag for EDL output - it's only settable via an ini file,
; which must be passed explicitly with --ini (comskip's own ini auto-discovery
; only runs on Windows). All other settings are left at comskip's compiled-in
; defaults.
[Main Settings]
output_edl=1
